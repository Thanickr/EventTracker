<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    />

    <title>Event Tracker</title>

    <link rel="stylesheet" href="./style.css" />
    <link rel="manifest" href="./manifest.json" />

    <meta name="theme-color" content="#222222" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
        name="apple-mobile-web-app-title"
        content="Event Tracker"
    />
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black"
    />
</head>

<body>
    <main class="app">
        <h1>Event Tracker</h1>
        <p class="subtitle">Capture an event quickly.</p>

        <section class="card">
            <label for="event-name">Event</label>
            <input
                id="event-name"
                type="text"
                placeholder="What happened?"
                autocomplete="off"
            />

            <label for="details">
                Details <span class="optional">(optional)</span>
            </label>
                <textarea
                    id="details"
                    rows="4"
                    placeholder="Optional details"
                ></textarea>

            <div class="time-section">
                <label class="checkbox-label">
                    <input
                        id="use-custom-time"
                        type="checkbox"
                    />
                    Enter a different event time
                </label>

                <div
                    id="custom-time-fields"
                    class="custom-time-fields"
                    hidden
                >
                    <label for="occurred-at">
                        Event date and time
                    </label>

                    <input
                        id="occurred-at"
                        type="datetime-local"
                    />
                </div>
            </div>

            <div
                id="edit-actions"
                class="edit-actions"
                hidden
            >
                <p class="edit-notice">
                    Editing a locally stored event.
                </p>

                <button
                    id="cancel-edit-button"
                    class="secondary-button"
                    type="button"
                >
                    Cancel Edit
                </button>
            </div>

            <button
                id="save-button"
                type="button"
            >
                Save Event
            </button>

            <p
                id="status-message"
                class="status"
            ></p>
        </section>

        <section class="card">
            <div class="section-heading-row">
                <div>
                    <h2>Events</h2>

                    <p
                        id="local-event-count"
                        class="event-count"
                    ></p>
                </div>

                <button
                    id="toggle-events-button"
                    class="text-button"
                    type="button"
                >
                    Hide
                </button>
            </div>

            <div
                id="event-view-controls"
                class="event-view-controls"
            >
                <div class="view-mode-toggle">
                    <button
                        id="timeline-view-button"
                        class="view-mode-button active"
                        type="button"
                    >
                        Timeline
                    </button>

                    <button
                        id="list-view-button"
                        class="view-mode-button"
                        type="button"
                    >
                        List
                    </button>
                </div>

                <div class="day-navigation">
                    <button
                        id="previous-day-button"
                        class="day-navigation-button"
                        type="button"
                        aria-label="Previous day"
                    >
                        ‹
                    </button>

                    <button
                        id="selected-day-button"
                        class="selected-day-button"
                        type="button"
                    >
                        Today
                    </button>

                    <button
                        id="next-day-button"
                        class="day-navigation-button"
                        type="button"
                        aria-label="Next day"
                    >
                        ›
                    </button>
                </div>
            </div>

            <div
                id="timeline-view"
                class="timeline-view"
            >
                <div
                    id="timeline-focus-controls"
                    class="timeline-focus-controls"
                    hidden
                >
                    <button
                        id="timeline-back-button"
                        class="timeline-back-button"
                        type="button"
                    >
                        Back to Day
                    </button>

                    <p
                        id="timeline-focus-label"
                        class="timeline-focus-label"
                    ></p>
                </div>

                <div
                    id="timeline-scroll"
                    class="timeline-scroll"
                >
                    <div
                        id="timeline"
                        class="timeline"
                    ></div>
                </div>
            </div>

            <div
                id="list-view"
                class="list-view"
                hidden
            >
                <div
                    id="events-list"
                    class="events-list"
                ></div>

                <button
                    id="show-all-events-button"
                    class="text-button show-all-button"
                    type="button"
                >
                    Show All
                </button>
            </div>

            <div class="sync-section">
                <h3>Transfer to Computer</h3>

                <p class="section-description">
                    Export only events that have not yet been added
                    to SQLite.
                </p>

                <button
                    id="export-pending-button"
                    class="secondary-button"
                    type="button"
                >
                    Export Pending Events
                </button>

                <button
                    id="apply-receipt-button"
                    class="secondary-button"
                    type="button"
                >
                    Apply Sync Receipt
                </button>

                <input
                    id="receipt-file"
                    type="file"
                    accept="application/json,.json"
                    hidden
                />

                <p
                    id="sync-status-message"
                    class="status"
                ></p>
            </div>

            <div class="device-storage-section">
                <h3>Device Storage</h3>

                <p class="section-description">
                    Delete every event currently stored on this device.
                    This does not affect events already stored in SQLite.
                </p>

                <button
                    id="clear-local-events-button"
                    class="danger-button"
                    type="button"
                >
                    Clear Local Events
                </button>

                <p
                    id="device-storage-status"
                    class="status"
                ></p>
            </div>
        </section>
    </main>

    <script src="./db.js"></script>
    <script src="./app.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker
                .register("./service-worker.js")
                .catch((error) => {
                    console.error(
                        "Service worker registration failed:",
                        error
                    );
                });
        }
    </script>
</body>
</html>
